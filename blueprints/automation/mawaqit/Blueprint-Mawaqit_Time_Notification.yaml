blueprint:
  name: Mawaqit Time Notification
  description:
    Notification at the time of the mawaqit prayers. PLEASE make sure to
    install 'Mawaqit Prayer Times' integration before you use this blueprint.
  domain: automation
  input:
    Next_Salat_Name:
      name: Next prayer sensor
      description:
        The MAWAQIT "Next Salat Name" sensor. Its entity ID depends on the
        language of Home Assistant when the integration was added.
      selector:
        entity:
          filter:
            integration: mawaqit
            domain: sensor
    Mobile_to_Notify:
      name: Mobile 1 Device to notify
      description:
        Device needs to run the official Home Assistant app to receive
        notifications.
      default: ""
      selector:
        device:
          integration: mobile_app
    Mobile2_to_Notify:
      name: Mobile 2 Device to notify
      description:
        Device needs to run the official Home Assistant app to receive
        notifications.
      default: ""
      selector:
        device:
          integration: mobile_app

    Media_Player_to_Notify:
      name: Media Player to play Athan
      description: Choose Media player device to play the Athan.
      selector:
        entity:
          domain: media_player
    Athan_Media:
      name: Athan Media
      description: Name of the playlist that contains the Athan sound or mp3 link if using service music
    Athan_Media_Fajr:
      name: Athan Media Fajr
      description: Name of the playlist that contains the Fajr Athan sound or mp3 link if using service music
    Music_Service:
      name: Music Service
      description: Name of the music service you are subscribed to.
      selector:
        select:
          options:
            - music
            - APPLE_MUSIC
            - AMAZON_MUSIC
            - SPOTIFY
  source_url: https://gist.github.com/shadynafie/1bc4e28717fe0955a828e8d092f7e4bf

# next_salat_name switches to the following prayer when a prayer time is reached,
# so the previous state is the prayer that just started.
trigger:
  - platform: state
    entity_id: !input "Next_Salat_Name"
    id: salat

condition: []
action:
  - choose:
      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'shuruq' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد شروق الشمس
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد شروق الشمس
      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'fajr' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة الفجر
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة الفجر
          - service: media_player.play_media
            target:
              entity_id: !input "Media_Player_to_Notify"
            data:
              media_content_id: !input "Athan_Media_Fajr"
              media_content_type: !input "Music_Service"

      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'dhuhr' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة الظهر
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة الظهر
          - service: media_player.play_media
            target:
              entity_id: !input "Media_Player_to_Notify"
            data:
              media_content_id: !input "Athan_Media"
              media_content_type: !input "Music_Service"

      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'asr' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة العصر
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة العصر
          - service: media_player.play_media
            target:
              entity_id: !input "Media_Player_to_Notify"
            data:
              media_content_id: !input "Athan_Media"
              media_content_type: !input "Music_Service"

      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'maghrib' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة المغرب
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة المغرب
          - service: media_player.play_media
            target:
              entity_id: !input "Media_Player_to_Notify"
            data:
              media_content_id: !input "Athan_Media"
              media_content_type: !input "Music_Service"
      - conditions:
          - condition: trigger
            id: salat
          - condition: template
            value_template: "{{ trigger.from_state.state == 'isha' }}"
        sequence:
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة العشاء
          - type: notify
            domain: mobile_app
            device_id: !input "Mobile2_to_Notify"
            title: 🕌 Prayer Time 🕌
            message: حان الآن موعد صلاة العشاء
          - service: media_player.play_media
            target:
              entity_id: !input "Media_Player_to_Notify"
            data:
              media_content_id: !input "Athan_Media"
              media_content_type: !input "Music_Service"

    default: []
mode: single
