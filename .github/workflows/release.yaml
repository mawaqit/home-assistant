name: Release

on:
  # Creates a draft release from the manifest version, so the tag always matches it.
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release (beta)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the zip
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the manifest version
        run: echo "TAG=v$(jq -r .version custom_components/mawaqit/manifest.json)" >> "$GITHUB_ENV"
      - name: Check the version
        run: |
          if [[ "$TAG" == *dev* ]]; then
            echo "::error::$TAG is a development version, bump the manifest first (see RELEASING.md)"
            exit 1
          fi
      - name: Create the draft release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          gh release create "$TAG" --draft --generate-notes --title "$TAG"
          --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
      - name: Build the zip
        # Files at the zip root: users extract it into custom_components/mawaqit.
        run: cd custom_components/mawaqit && zip -r "$RUNNER_TEMP/mawaqit.zip" . -x "*__pycache__*" ".gitignore"
      - name: Attach the zip
        # Releases are immutable: assets can only be attached to the draft.
        run: gh release upload "$TAG" "$RUNNER_TEMP/mawaqit.zip"
