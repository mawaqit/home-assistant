# Sections of the notes generated for each GitHub release, picked from PR labels.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - feat
    - title: Bug fixes
      labels:
        - bug
    - title: Translations
      labels:
        - translations
    - title: Documentation
      labels:
        - docs
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
