name: Bug report
description: Wrong prayer times or another problem with the integration.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: >-
        What you expected and what you got instead. For wrong prayer times,
        give the prayer, the time shown in Home Assistant and the time shown by
        the MAWAQIT app or website.
    validations:
      required: true
  - type: input
    id: mosque
    attributes:
      label: Mosque
      description: >-
        Optional. Name and city of your mosque, if it helps to understand the
        problem. Like everything in this issue, it is publicly visible.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Shown in _Settings > About_.
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: >-
        Shown in HACS. For a manual installation, it is the `version` in
        `custom_components/mawaqit/manifest.json`. Not needed if you attach the
        diagnostics file, which contains it.
      placeholder: 4.0.0
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Go to _Settings > Devices & Services > MAWAQIT_, open the ⋮ menu of the
        entry, select **Download diagnostics** and drag the file here. Your
        MAWAQIT token, your home location and your mosque are removed from it. If the
        integration does not load, the download is not available: say so and
        add the logs below.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors mentioning `mawaqit` in _Settings > System > Logs_.
      render: text
